<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>凌云社 · MikuBug</title>
<meta name="description" content="凌云社 MikuBug" />
<meta name="theme-color" content="#f3f6f9" />
<link rel="icon" href="%BASE_URL%assets/logo.png" />
<link rel="preload" href="%BASE_URL%assets/logo.png" as="image" />
<script>
  /* 1) 主题：在样式生效前落到 <html>，避免首屏闪色。
        没手动切换过就跟随系统配色。 */
  (function () {
    var v = null;
    try { v = localStorage.getItem('mikubug.theme'); } catch (e) { /* 忽略 */ }
    if (v !== 'light' && v !== 'dark') {
      v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = v;
    document.documentElement.style.colorScheme = v;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', v === 'dark' ? '#1a1a1a' : '#f3f6f9');
  })();

  /* 2) history 路由：兼容旧版 hash 链接（/#/works/x → /works/x），
        并从 404 回退页还原真实地址；必须早于 Vue 挂载，否则会先渲染首页 */
  (function () {
    try {
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.pathname.replace(/\/[^/]*$/, '/') + location.hash.slice(2));
      }
    } catch (e) { /* 忽略 */ }

    try {
      var to = sessionStorage.getItem('mikubug.redirect');
      if (!to) return;
      sessionStorage.removeItem('mikubug.redirect');
      if (to !== location.pathname + location.search + location.hash) {
        history.replaceState(null, '', to);
      }
    } catch (e) { /* 忽略 */ }
  })();
</script>
</head>
<body>

<div id="app"></div>

<noscript>
  <div class="noscript">本站需要启用 JavaScript 才能浏览。</div>
</noscript>

<script type="module" src="/src/main.js"></script>
</body>
</html>
